name: Bootstrap production artifacts

on:
  push:
    branches:
      - chatgpt/premium-marketplace-redesign
    paths:
      - .github/workflows/bootstrap-artifacts.yml
      - package.json
      - drizzle.config.ts
      - src/db/**

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/premium-marketplace-redesign
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and create lockfile
        run: npm install --no-audit --no-fund

      - name: Generate Drizzle migrations
        env:
          DATABASE_URL: postgresql://verotask:verotask@localhost:5432/verotask
        run: npm run db:generate -- --name=initial_production

      - name: Commit generated production artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json drizzle/
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "build: add deterministic lockfile and database migrations"
          git push origin HEAD:chatgpt/premium-marketplace-redesign
