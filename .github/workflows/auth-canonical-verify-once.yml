name: Auth Canonical Verify Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auth-canonical-verify-once.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production callback origins
        shell: bash
        run: |
          set -euo pipefail

          probe() {
            local url="$1"
            local headers
            headers="$(mktemp)"
            curl -sS -D "$headers" -o /dev/null --connect-timeout 10 --max-time 20 "$url"

            local location
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
            echo "$url"
            echo "Location: $location"

            if [ -z "$location" ]; then
              echo "Missing redirect Location header"
              cat "$headers"
              exit 1
            fi

            case "$location" in
              https://www.verotask.online/*) ;;
              *)
                echo "Unsafe callback origin: $location"
                exit 1
                ;;
            esac

            if [[ "$location" == *".vercel.app"* ]]; then
              echo "Vercel alias escaped into a customer callback"
              exit 1
            fi
          }

          probe "https://www.verotask.online/api/auth/verify?token=definitely-invalid"
          probe "https://www.verotask.online/api/claims/verify-email?claim=00000000-0000-0000-0000-000000000000&token=definitely-invalid"

          echo "AUTH_CANONICAL_OK"
