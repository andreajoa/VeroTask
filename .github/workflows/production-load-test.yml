name: VeroTask Production Load Test

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: Concurrent requests (start at 100; raise deliberately after each green run)
        required: false
        default: "100"
      requests:
        description: Total requests
        required: false
        default: "600"

permissions:
  contents: read

concurrency:
  group: verotask-production-load-test
  cancel-in-progress: false

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROD_URL: ${{ vars.VEROTASK_PRODUCTION_URL || 'https://www.verotask.online' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify public production target
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -L --silent --show-error --output /tmp/verotask-health --write-out '%{http_code}' --max-time 15 "$PROD_URL/api/health" || true)"
          ready="$(curl -L --silent --show-error --output /tmp/verotask-ready --write-out '%{http_code}' --max-time 20 "$PROD_URL/api/ready" || true)"
          echo "$PROD_URL health -> HTTP $code"
          echo "$PROD_URL ready -> HTTP $ready"
          if [ "$code" != "200" ] || [ "$ready" != "200" ]; then
            echo "Production must be healthy and ready before load testing."
            cat /tmp/verotask-health || true
            cat /tmp/verotask-ready || true
            exit 1
          fi

      - name: Run deliberate production load test
        env:
          BASE_URL: ${{ env.PROD_URL }}
          CONCURRENCY: ${{ github.event.inputs.concurrency || '100' }}
          REQUESTS: ${{ github.event.inputs.requests || '600' }}
          LOAD_PATHS: /api/health,/api/ready,/
          REQUEST_TIMEOUT_MS: "15000"
          MAX_ERROR_RATE: "0.01"
        run: node scripts/load-test.mjs
