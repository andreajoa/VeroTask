name: VeroTask Production Load Test

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: Concurrent requests
        required: false
        default: "1000"
      requests:
        description: Total requests
        required: false
        default: "3000"
  push:
    paths:
      - ".github/workflows/production-load-test.yml"
      - "scripts/load-test.mjs"

permissions:
  contents: read

concurrency:
  group: verotask-production-load-test
  cancel-in-progress: false

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve live Vercel alias
        id: production
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            "https://vero-task.vercel.app"
            "https://vero-task-andres-projects-bbfd1881.vercel.app"
            "https://vero-task-git-main-andres-projects-bbfd1881.vercel.app"
          )
          for base in "${candidates[@]}"; do
            code="$(curl -L --silent --show-error --output /tmp/verotask-health --write-out '%{http_code}' --max-time 15 "$base/api/health" || true)"
            echo "$base -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "base_url=$base" >> "$GITHUB_OUTPUT"
              echo "Resolved production candidate: $base"
              exit 0
            fi
          done
          echo "No known Vercel alias returned HTTP 200 from /api/health"
          exit 1

      - name: Verify production at 1,000 concurrent requests
        env:
          BASE_URL: ${{ steps.production.outputs.base_url }}
          CONCURRENCY: ${{ github.event.inputs.concurrency || '1000' }}
          REQUESTS: ${{ github.event.inputs.requests || '3000' }}
          LOAD_PATHS: /api/health,/api/ready,/
          REQUEST_TIMEOUT_MS: "15000"
          MAX_ERROR_RATE: "0.01"
        run: node scripts/load-test.mjs
