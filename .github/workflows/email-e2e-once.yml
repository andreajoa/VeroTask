name: Email E2E Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/email-e2e-once.yml'

permissions:
  contents: read

jobs:
  magic-link:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install browser harness
        run: npm install --no-save --package-lock=false playwright-core@1.55.0

      - name: Request production magic link
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        shell: bash
        run: |
          cat > .email-e2e.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          const browser = await chromium.launch({ executablePath: process.env.CHROME_PATH, headless: true, args: ['--no-sandbox'] });
          const page = await browser.newPage();
          await page.goto('https://vero-task.vercel.app/signin', { waitUntil: 'networkidle', timeout: 60000 });
          await page.locator('input[name="email"]').fill('verotask-e2e@concursotrilhaaprova.online');
          await Promise.all([
            page.waitForURL(/sent=1/, { timeout: 60000 }),
            page.getByRole('button', { name: 'Email me a secure link' }).click()
          ]);
          const body = await page.textContent('body');
          if (!body?.includes('Check your inbox. Your secure VeroTask sign-in link is on the way.')) {
            throw new Error('magic_link_confirmation_missing');
          }
          console.log('magic_link_request_accepted');
          await browser.close();
          NODE
          node .email-e2e.mjs
