name: Webhook Monitor Credential Probe (once)

# One-shot: finds out which credential production accepts for the liveness
# monitor, and reads the monitor's verdict against the real production
# database. Delete once the monitor is wired.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Try the monitor credential
        env:
          TOKEN: ${{ secrets.VEROTASK_WEBHOOK_MONITOR_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -s -o body.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
            https://www.verotask.online/api/monitoring/stripe-webhook)
          echo "monitor token -> HTTP $code"
          cat body.json; echo
      - name: Try the cron credential already trusted by production
        env:
          TOKEN: ${{ secrets.VEROTASK_EMAIL_CRON_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -s -o body.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
            https://www.verotask.online/api/monitoring/stripe-webhook)
          echo "cron token -> HTTP $code"
          cat body.json; echo
