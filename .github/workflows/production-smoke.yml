name: Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PROD_URL: ${{ vars.VEROTASK_PRODUCTION_URL || 'https://www.verotask.online' }}
    steps:
      - name: Wait for production deployment
        shell: bash
        run: |
          set -euo pipefail
          URL="$PROD_URL/api/ready"
          sleep 20
          code=$(curl -sS -D /tmp/ready.headers -o /tmp/ready.json -w "%{http_code}" --connect-timeout 10 --max-time 20 "$URL" || true)
          echo "Readiness returned HTTP $code"
          if [ "$code" != "200" ]; then
            echo "Response headers:"
            cat /tmp/ready.headers || true
            echo "Response body:"
            cat /tmp/ready.json || true
            exit 1
          fi
          cat /tmp/ready.json

      - name: Validate readiness contract
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .ok == true and
            .status == "ready" and
            .service == "verotask" and
            .market == "Orlando / Central Florida" and
            .paymentModel == "booking_fee_only" and
            .checks.database == true and
            .checks.databaseError == false and
            .checks.productionUrlValid == true and
            .checks.configuredAppUrlValid == true and
            .checks.staleConfiguredAppUrl == false and
            .checks.supportEmailConfigured == true and
            .checks.requiredEnvironmentConfigured == true and
            .checks.missingEnvironmentCount == 0
          ' /tmp/ready.json >/dev/null

      - name: Verify public customer pages
        shell: bash
        run: |
          set -euo pipefail
          for path in / /signin /services /locations/orlando-fl /protection /terms /robots.txt /sitemap.xml /llms.txt; do
            code=$(curl -LsS -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 25 "$PROD_URL${path}")
            echo "$path -> $code"
            test "$code" = "200"
          done

      - name: Verify Google Search Console tag
        shell: bash
        run: |
          set -euo pipefail
          curl -LsS --connect-timeout 10 --max-time 25 "$PROD_URL/" > /tmp/home.html
          grep -Fq 'name="google-site-verification"' /tmp/home.html
          grep -Fq 'content="g7DcEyI2I4ao2UQTEm5pvalz7vB3sIWIyJ8urKACCf0"' /tmp/home.html
          echo "Google Search Console verification tag is present."

      - name: Verify Orlando SEO and GEO signals
        shell: bash
        run: |
          set -euo pipefail
          curl -LsS --connect-timeout 10 --max-time 25 "$PROD_URL/locations/orlando-fl" > /tmp/orlando.html
          grep -qi 'Orlando' /tmp/orlando.html
          grep -qi 'Central Florida' /tmp/orlando.html
          curl -LsS --connect-timeout 10 --max-time 25 "$PROD_URL/llms.txt" > /tmp/llms.txt
          grep -Fqi 'Primary market: Orlando, Florida, United States' /tmp/llms.txt
          grep -Fqi 'It is not positioned as a global marketplace' /tmp/llms.txt
          curl -LsS --connect-timeout 10 --max-time 25 "$PROD_URL/sitemap.xml" > /tmp/sitemap.xml
          grep -Fq '/locations/orlando-fl' /tmp/sitemap.xml
          echo "Orlando-local SEO/GEO signals are present."

      - name: Verify security and cache headers
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSI --connect-timeout 10 --max-time 25 "$PROD_URL/" > /tmp/headers.txt
          cat /tmp/headers.txt
          grep -qi '^x-content-type-options: nosniff' /tmp/headers.txt
          grep -qi '^referrer-policy:' /tmp/headers.txt
