name: Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PROD_URL: https://vero-task-andres-projects-bbfd1881.vercel.app
    steps:
      - name: Wait for production deployment
        shell: bash
        run: |
          set -euo pipefail
          URL="$PROD_URL/api/ready"
          code=""
          for i in $(seq 1 30); do
            : > /tmp/ready.headers
            code=$(curl -sS -D /tmp/ready.headers -o /tmp/ready.json -w "%{http_code}" --connect-timeout 10 --max-time 20 "$URL" || true)
            echo "Attempt $i: readiness returned HTTP $code"
            if [ "$code" = "200" ]; then
              break
            fi
            if [[ "$code" =~ ^30[12378]$ ]]; then
              echo "Redirect response headers:"
              cat /tmp/ready.headers
              echo "Redirect target: $(awk 'BEGIN{IGNORECASE=1} /^location:/ {$1=""; sub(/^ /, ""); gsub(/\r/, ""); print; exit}' /tmp/ready.headers)"
              break
            fi
            sleep 10
          done
          if [ "${code:-}" != "200" ]; then
            echo "Final response headers:"
            cat /tmp/ready.headers || true
            echo "Final response body:"
            cat /tmp/ready.json || true
            exit 1
          fi
          cat /tmp/ready.json

      - name: Validate readiness contract
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .ok == true and
            .status == "ready" and
            .service == "verotask" and
            .market == "Orlando / Central Florida" and
            .paymentModel == "booking_fee_only" and
            .checks.database == true and
            .checks.databaseError == false and
            .checks.productionUrlValid == true and
            .checks.requiredEnvironmentConfigured == true and
            .checks.missingEnvironmentCount == 0
          ' /tmp/ready.json >/dev/null

      - name: Verify public customer pages
        shell: bash
        run: |
          set -euo pipefail
          for path in / /signin /services /protection /terms; do
            code=$(curl -LsS -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 25 "$PROD_URL${path}")
            echo "$path -> $code"
            test "$code" = "200"
          done

      - name: Verify security and cache headers
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSI --connect-timeout 10 --max-time 25 "$PROD_URL/" > /tmp/headers.txt
          cat /tmp/headers.txt
          grep -qi '^x-content-type-options: nosniff' /tmp/headers.txt
          grep -qi '^referrer-policy:' /tmp/headers.txt
