name: VeroTask Hourly Settlement

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run protected settlement endpoint
        env:
          APP_URL: ${{ vars.VEROTASK_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "VEROTASK_APP_URL repository variable and CRON_SECRET repository secret are required."
            exit 1
          fi
          curl --fail --silent --show-error \
            --retry 2 \
            --max-time 240 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/settle-bookings"
