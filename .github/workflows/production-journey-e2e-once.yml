name: Production Journey E2E Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-journey-e2e-once.yml'

permissions:
  contents: read

jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://www.verotask.online
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install browser harness
        run: npm install --no-save --package-lock=false playwright-core@1.55.0

      - name: Run production request-to-checkout journey without payment
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        shell: bash
        run: |
          cat > .production-journey-e2e.mjs <<'NODE'
          import { chromium } from "playwright-core";
          import assert from "node:assert/strict";

          const BASE = process.env.BASE_URL.replace(/\/$/, "");
          const report = {
            startedAt: new Date().toISOString(),
            checks: [],
            liveChargeAttempted: false,
            livePaymentCompleted: false
          };
          const pass = (name, details={}) => {
            report.checks.push({ name, passed: true, ...details });
            console.log("PASS", name);
          };
          const sleep = ms => new Promise(r => setTimeout(r, ms));

          async function createMailbox(label) {
            const response = await fetch("https://api.tempmail.lol/v2/inbox/create", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ prefix: label + "-" + Date.now().toString(36) })
            });
            if (!response.ok) throw new Error("tempmail_create_" + response.status);
            return response.json();
          }

          async function waitMagicLink(mailbox) {
            const deadline = Date.now() + 120000;
            while (Date.now() < deadline) {
              const response = await fetch("https://api.tempmail.lol/v2/inbox?token=" + encodeURIComponent(mailbox.token));
              if (!response.ok) throw new Error("tempmail_inbox_" + response.status);
              const data = await response.json();
              const item = data.emails?.find(m => m.subject === "Your secure VeroTask sign-in link");
              if (item) {
                const source = [item.body, item.html].filter(Boolean).join("\n");
                const link = source.match(/https:\/\/www\.verotask\.online\/api\/auth\/verify\?token=[a-f0-9]+/i)?.[0];
                if (link) return link;
              }
              await sleep(2500);
            }
            throw new Error("magic_link_not_received");
          }

          async function login(page, mailbox, nextPath) {
            await page.goto(`${BASE}/signin?next=${encodeURIComponent(nextPath)}`, { waitUntil: "domcontentloaded", timeout: 60000 });
            await page.getByLabel("Email address").fill(mailbox.address);
            await Promise.all([
              page.waitForURL(/\/signin\?sent=1/, { timeout: 60000 }),
              page.getByRole("button", { name: "Email me a secure link" }).click()
            ]);
            const link = await waitMagicLink(mailbox);
            await page.goto(link, { waitUntil: "domcontentloaded", timeout: 60000 });
            assert(new URL(page.url()).pathname.startsWith(nextPath.split("?")[0]), `login_redirect_mismatch:${page.url()}`);
          }

          async function waitHealthy() {
            const deadline = Date.now() + 90000;
            while (Date.now() < deadline) {
              try {
                const r = await fetch(`${BASE}/api/health`, { redirect: "follow" });
                if (r.ok) return;
              } catch {}
              await sleep(3000);
            }
            throw new Error("production_health_timeout");
          }

          await waitHealthy();
          pass("Production health endpoint reachable");

          const browser = await chromium.launch({
            executablePath: process.env.CHROME_PATH,
            headless: true,
            args: ["--no-sandbox"]
          });

          let provider;
          let customer;
          try {
            const providerMailbox = await createMailbox("verotask-provider-e2e");
            const customerMailbox = await createMailbox("verotask-customer-e2e");

            const providerContext = await browser.newContext({ viewport: { width: 1365, height: 900 } });
            provider = await providerContext.newPage();
            provider.setDefaultTimeout(60000);

            await login(provider, providerMailbox, "/providers/join");
            pass("Provider passwordless production login");

            const unique = Date.now().toString(36);
            await provider.getByLabel("Business or professional name").fill(`VeroTask QA ${unique}`);
            await provider.getByLabel("Phone", { exact: true }).fill("(407) 555-0198");
            await provider.getByLabel("ZIP code", { exact: true }).fill("32801");
            await provider.getByLabel("Primary city").fill("Orlando");
            await provider.getByLabel("Primary service").selectOption("furniture-assembly");
            await provider.getByLabel("Private service base address").fill("400 South Orange Avenue");
            await provider.getByLabel("How far are you willing to travel?").selectOption("15");
            await provider.getByLabel("What kind of work do you do?").fill("Automated VeroTask production QA profile used only to validate the request, acceptance and booking-fee checkout flow.");
            await provider.getByRole("button", { name: "Create provider profile" }).click();
            await provider.waitForURL(/\/dashboard\/providers\/[0-9a-f-]+\/onboarding/, { timeout: 60000 });
            const businessId = new URL(provider.url()).pathname.split("/")[3];
            assert.match(businessId, /^[0-9a-f-]{36}$/i);
            report.businessId = businessId;
            pass("Provider profile created", { businessId });

            const photoUpload = await provider.evaluate(async (id) => {
              const canvas = document.createElement("canvas");
              canvas.width = 900;
              canvas.height = 900;
              const ctx = canvas.getContext("2d");
              if (!ctx) throw new Error("qa_canvas_unavailable");
              const image = ctx.createImageData(900, 900);
              for (let i = 0; i < image.data.length; i += 4) {
                const n = (i / 4) % 251;
                image.data[i] = n;
                image.data[i + 1] = (n * 7) % 255;
                image.data[i + 2] = (n * 13) % 255;
                image.data[i + 3] = 255;
              }
              ctx.putImageData(image, 0, 0);
              const blob = await new Promise((resolve, reject) => canvas.toBlob(value => value ? resolve(value) : reject(new Error("qa_photo_encode_failed")), "image/jpeg", 0.82));
              const form = new FormData();
              form.set("photo", new File([blob], "qa-profile.jpg", { type: "image/jpeg" }));
              form.set("attestedRecent", "true");
              const response = await fetch(`/api/providers/${id}/photo`, { method: "POST", body: form });
              return { status: response.status, body: await response.json().catch(() => ({})) };
            }, businessId);
            assert.equal(photoUpload.status, 200, "provider profile photo upload failed: " + JSON.stringify(photoUpload.body));
            pass("Provider recent profile photo uploaded");

            const servicesResponse = await provider.goto(`${BASE}/dashboard/providers/${businessId}/services`, { waitUntil: "domcontentloaded" });
            console.log("SERVICES_ROUTE", servicesResponse?.status(), provider.url());
            await provider.locator('select[name="categoryId"]').waitFor({ state: "visible", timeout: 60000 });
            await provider.locator('select[name="categoryId"]').selectOption({ label: "Furniture Assembly" });
            await provider.locator('input[name="name"]').fill("QA Furniture Assembly");
            await provider.locator('textarea[name="description"]').fill("Automated QA fixed-price service. No real appointment will occur.");
            await provider.locator('input[name="price"]').fill("85.00");
            await provider.locator('input[name="durationMinutes"]').fill("60");
            await provider.getByRole("button", { name: "Add service", exact: true }).click();
            await provider.waitForURL(/\/services\?notice=created/, { timeout: 60000 });
            pass("Fixed-price service created");

            await provider.goto(`${BASE}/dashboard/providers/${businessId}/availability`, { waitUntil: "domcontentloaded" });
            for (let day=0; day<7; day++) {
              await provider.locator(`input[name="active-${day}"]`).check();
              await provider.locator(`input[name="start-${day}"]`).fill("08:00");
              await provider.locator(`input[name="end-${day}"]`).fill("18:00");
            }
            await provider.getByRole("button", { name: "Save working hours" }).click();
            await provider.waitForURL(/\/availability\?notice=saved/, { timeout: 60000 });
            pass("Provider availability configured");

            const publicProviderPath = `/providers/pro-${businessId}`;
            await provider.goto(`${BASE}${publicProviderPath}`, { waitUntil: "domcontentloaded" });
            const requestLink = provider.getByRole("link", { name: "Request quote", exact: true }).last();
            await requestLink.waitFor();
            const href = await requestLink.getAttribute("href");
            assert(href);
            const serviceId = new URL(href, BASE).searchParams.get("service");
            assert.match(serviceId || "", /^[0-9a-f-]{36}$/i);
            report.serviceId = serviceId;
            const publicBody = await provider.textContent("body");
            assert(!publicBody?.includes("(407) 555-0198"), "provider phone leaked on public profile");
            assert(!publicBody?.includes(`VeroTask QA ${unique}`), "real provider identity leaked on public profile");
            pass("Public provider profile is contact-private and quote enabled", { serviceId });

            const customerContext = await browser.newContext({ viewport: { width: 1365, height: 900 } });
            customer = await customerContext.newPage();
            customer.setDefaultTimeout(60000);

            const bookPath = `/book/pro-${businessId}?service=${serviceId}`;
            await login(customer, customerMailbox, bookPath);
            pass("Customer passwordless production login");

            const privacyButton = customer.getByRole("button", { name: "Essential only", exact: true });
            try {
              await privacyButton.waitFor({ state: "visible", timeout: 5000 });
              await privacyButton.click();
            } catch {}

            const target = new Date(Date.now() + 4 * 86400000);
            const scheduledLocal = target.toISOString().slice(0, 10) + "T10:00";
            await customer.locator('[name="scope"]').selectOption("small");
            await customer.locator('[name="jobLength"]').selectOption("under-2h");
            await customer.locator('[name="timeline"]').selectOption("specific-date");
            await customer.locator('[name="postalCode"]').fill("32801");
            await customer.locator('[name="scheduledLocal"]').fill(scheduledLocal);
            await customer.locator('[name="serviceAddress"]').fill("400 South Orange Avenue, Orlando, FL 32801");
            await customer.locator('[name="details"]').fill("Assemble one boxed furniture item. All parts and instructions are available onsite. No wall mounting is required.");
            await customer.locator('[name="acceptsPolicy"]').check();
            await customer.getByRole("button", { name: "Request a quote", exact: true }).click();
            await customer.waitForURL(/\/bookings\/[0-9a-f-]+\?requested=1/, { timeout: 60000 });
            const bookingId = new URL(customer.url()).pathname.split("/")[2];
            report.bookingId = bookingId;
            pass("Structured customer quote request created with no payment", { bookingId });

            await provider.goto(`${BASE}/bookings/${bookingId}`, { waitUntil: "domcontentloaded" });
            const providerBodyBeforeQuote = await provider.textContent("body");
            assert(!providerBodyBeforeQuote?.includes("400 South Orange Avenue"), "exact service address leaked before payment");
            assert(providerBodyBeforeQuote?.includes("ZIP 32801"), "service ZIP missing from provider brief");
            pass("Provider sees service area but not exact address before payment");

            await provider.getByLabel("Your service price").fill("120.00");
            await provider.getByRole("button", { name: "Send quote and accept", exact: true }).click();
            await provider.getByText("Quote sent", { exact: true }).waitFor({ timeout: 60000 });
            const providerBodyAfterQuote = await provider.textContent("body");
            assert(!providerBodyAfterQuote?.includes("400 South Orange Avenue"), "exact service address leaked after quote but before payment");
            pass("Provider submitted $120 quote while exact address remained private");

            const paymentResponse = await customer.request.post(`${BASE}/api/bookings/${bookingId}/payment-session`);
            assert.equal(paymentResponse.status(), 200, `payment-session HTTP ${paymentResponse.status()}`);
            const payment = await paymentResponse.json();
            assert.equal(payment.bookingId, bookingId);
            assert.equal(typeof payment.clientSecret, "string");
            assert(payment.clientSecret.startsWith("cs_live_"), "expected live Checkout Session client secret");
            report.checkoutSessionCreated = true;
            report.checkoutClientSecretLive = true;
            pass("LIVE Stripe booking-fee Checkout Session created from provider quote without submitting payment");

            const cancelResponse = await customer.request.post(`${BASE}/api/bookings/${bookingId}/cancel`, {
              data: { reason: "Automated launch QA cancellation before any payment was submitted." }
            });
            assert.equal(cancelResponse.status(), 200, `cancel HTTP ${cancelResponse.status()}`);
            const cancellation = await cancelResponse.json();
            assert.equal(cancellation.refundCents, 0);
            assert.equal(cancellation.status, "cancelled");
            pass("Unpaid booking cancelled with zero refund and checkout invalidation");

            await provider.goto(`${BASE}/dashboard/providers/${businessId}/services`, { waitUntil: "domcontentloaded" });
            const hideButton = provider.getByRole("button", { name: "Hide service", exact: true }).first();
            if (await hideButton.count()) {
              await hideButton.click();
              await provider.waitForLoadState("domcontentloaded");
            }
            pass("QA service hidden after journey");

            report.completedAt = new Date().toISOString();
            report.success = true;
            console.log("E2E_RESULT", JSON.stringify({
              success: true,
              businessId,
              serviceId,
              bookingId,
              checkoutSessionCreated: true,
              quoteCents: 12000,
              expectedFreePlanBookingFeeCents: 1800,
              liveChargeAttempted: false,
              livePaymentCompleted: false,
              checks: report.checks.map(x => x.name)
            }));
          } catch (error) {
            report.success = false;
            report.failure = String(error?.message || error).replace(/token=[a-f0-9]+/gi, "token=[redacted]").replace(/cs_live_[^\s"']+/g, "cs_live_[redacted]");
            console.error("E2E_FAILURE", report.failure);
            process.exitCode = 1;
          } finally {
            await browser.close();
          }
          NODE
          node .production-journey-e2e.mjs
