name: Finalize fee-only CRM cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-connect-deps-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fix customer spend semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/crm-automation.ts')
          text = path.read_text()
          old = "then ${bookings.subtotalCents} else 0 end), 0)::int`"
          new = "then ${bookings.marketplaceFeeCents} else 0 end), 0)::int`"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one legacy CRM spend expression, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify fee-only invariants
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q '"@stripe/connect-js"' package.json
          ! grep -q '"@stripe/react-connect-js"' package.json
          grep -q 'then \${bookings.marketplaceFeeCents} else 0 end' src/lib/crm-automation.ts
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Commit CRM correction
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/lib/crm-automation.ts; then
            echo 'CRM fee-only semantics already correct.'
            exit 0
          fi
          git config user.name 'VeroTask CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src/lib/crm-automation.ts
          git commit -m 'fix: count only VeroTask booking fees in CRM spend'
          git pull --rebase origin main
          git push origin HEAD:main
