name: Production Journey E2E TempMail

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-journey-e2e-tempmail.yml'
      - '.github/workflows/production-journey-e2e-once.yml'
      - 'src/lib/auth.ts'
      - 'src/lib/auth-session-cookie.ts'
      - 'src/app/signin/**'
      - 'src/app/api/auth/**'
      - 'src/app/book/**'
      - 'src/app/bookings/**'
      - 'src/app/providers/join/**'
      - 'src/components/provider-join-page.tsx'
      - 'src/components/services-page.tsx'
      - 'src/lib/distance.ts'
      - 'src/lib/geocoding.ts'
      - 'src/app/api/bookings/**'
      - 'src/lib/booking-notifications.ts'
      - 'src/lib/quote-request.ts'

permissions:
  contents: read

jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://www.verotask.online
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Install browser harness
        run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Extract quote-flow journey and use TempMail
        shell: bash
        run: |
          awk '
            /cat > \.production-journey-e2e\.mjs <<.NODE./ {capture=1; next}
            capture && /^          NODE$/ {capture=0; exit}
            capture {sub(/^          /, ""); print}
          ' .github/workflows/production-journey-e2e-once.yml > .production-journey-e2e.mjs

          node <<'NODE'
          const fs = require("fs");
          const path = ".production-journey-e2e.mjs";
          let source = fs.readFileSync(path, "utf8");

          source = source.replace(
            /async function createMailbox\(label\) \{[\s\S]*?\n          \}\n\n          async function waitMagicLink/,
            `async function createMailbox(label) {
            const response = await fetch("https://api.tempmail.lol/v2/inbox/create", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ prefix: label + "-" + Date.now().toString(36) })
            });
            if (!response.ok) throw new Error("tempmail_create_" + response.status);
            return response.json();
          }

          async function waitMagicLink`
          );

          source = source.replace(
            /async function waitMagicLink\(mailbox\) \{[\s\S]*?\n          \}\n\n          async function login/,
            `async function waitMagicLink(mailbox) {
            const deadline = Date.now() + 120000;
            while (Date.now() < deadline) {
              const response = await fetch("https://api.tempmail.lol/v2/inbox?token=" + encodeURIComponent(mailbox.token));
              if (!response.ok) throw new Error("tempmail_inbox_" + response.status);
              const data = await response.json();
              const item = data.emails?.find(m => m.subject === "Your secure VeroTask sign-in link");
              if (item) {
                const source = [item.body, item.html].filter(Boolean).join("\\n");
                const link = source.match(/https:\\/\\/www\\.verotask\\.online\\/api\\/auth\\/verify\\?token=[a-f0-9]+/i)?.[0];
                if (link) return link;
              }
              await sleep(2500);
            }
            throw new Error("magic_link_not_received");
          }

          async function login`
          );

          const sessionAnchor = 'pass("Customer passwordless production login");';
          const sessionPatch = `pass("Customer passwordless production login");
            const sessionCookies = await customerContext.cookies(BASE);
            const sessionCookie = sessionCookies.find(cookie => cookie.name === "verotask_session");
            assert(sessionCookie, "persistent VeroTask session cookie missing");
            assert(
              sessionCookie.domain === ".verotask.online" || sessionCookie.domain === "verotask.online",
              "session cookie is not shared across VeroTask hosts: " + sessionCookie.domain
            );
            assert(sessionCookie.expires > Math.floor(Date.now() / 1000) + 20 * 86400, "session cookie is not persistent");

            const savedCustomerState = await customerContext.storageState();
            const revisitContext = await newJourneyContext({ storageState: savedCustomerState });
            const revisit = await revisitContext.newPage();
            revisit.setDefaultTimeout(60000);
            await revisit.goto(\`\${BASE}/signin?next=%2Fservices\`, { waitUntil: "domcontentloaded", timeout: 60000 });
            await revisit.waitForURL(\`\${BASE}/services\`, { timeout: 60000 });
            assert.equal(new URL(revisit.url()).pathname, "/services");
            await revisitContext.close();
            pass("Customer session persists on a return visit without another sign-in");`;
          if (!source.includes(sessionAnchor)) throw new Error("session_persistence_patch_anchor_missing");
          source = source.replace(sessionAnchor, sessionPatch);

          fs.writeFileSync(path, source);
          NODE
      - name: Run protected quote journey without payment
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node .production-journey-e2e.mjs
