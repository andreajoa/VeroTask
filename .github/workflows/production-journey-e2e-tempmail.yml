name: Production Journey E2E TempMail
# protected-quote-flow-refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-journey-e2e-tempmail.yml'

permissions:
  contents: read

jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://www.verotask.online
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Install browser harness
        run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Extract and patch journey test
        shell: bash
        run: |
          awk '
            /cat > \.production-journey-e2e\.mjs <<.NODE./ {capture=1; next}
            capture && /^          NODE$/ {capture=0; exit}
            capture {sub(/^          /, ""); print}
          ' .github/workflows/production-journey-e2e-once.yml > .production-journey-e2e.mjs
          node <<'NODE'
          const fs = require("fs");
          const path = ".production-journey-e2e.mjs";
          let source = fs.readFileSync(path, "utf8");

          source = source.replace(
            /async function createMailbox\(label\) \{[\s\S]*?\n          \}\n\n          async function waitMagicLink/,
            `async function createMailbox(label) {
            const response = await fetch("https://api.tempmail.lol/v2/inbox/create", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ prefix: label + "-" + Date.now().toString(36) })
            });
            if (!response.ok) throw new Error("tempmail_create_" + response.status);
            return response.json();
          }

          async function waitMagicLink`
          );

          source = source.replace(
            /async function waitMagicLink\(mailbox\) \{[\s\S]*?\n          \}\n\n          async function login/,
            `async function waitMagicLink(mailbox) {
            const deadline = Date.now() + 120000;
            while (Date.now() < deadline) {
              const response = await fetch("https://api.tempmail.lol/v2/inbox?token=" + encodeURIComponent(mailbox.token));
              if (!response.ok) throw new Error("tempmail_inbox_" + response.status);
              const data = await response.json();
              const item = data.emails?.find(m => m.subject === "Your secure VeroTask sign-in link");
              if (item) {
                const source = [item.body, item.html].filter(Boolean).join("\\n");
                const link = source.match(/https:\\/\\/www\\.verotask\\.online\\/api\\/auth\\/verify\\?token=[a-f0-9]+/i)?.[0];
                if (link) return link;
              }
              await sleep(2500);
            }
            throw new Error("magic_link_not_received");
          }

          async function login`
          );

          const needle = 'pass("Customer passwordless production login");';
          const replacement = `pass("Customer passwordless production login");
            const privacyButton = customer.getByRole("button", { name: "Essential only", exact: true });
            try {
              await privacyButton.waitFor({ state: "visible", timeout: 5000 });
              await privacyButton.click();
              pass("Customer privacy choice saved");
            } catch {
              console.log("PRIVACY_BANNER_NOT_PRESENT");
            }`;
          if (!source.includes(needle)) throw new Error("privacy_patch_anchor_missing");
          source = source.replace(needle, replacement);

          const r2Anchor = 'pass("Provider accepted booking request");';
          const r2Patch = `pass("Provider accepted booking request");

            let storageFailure = null;
            try {
              const presignResponse = await provider.request.post(\`\${BASE}/api/bookings/\${bookingId}/uploads/presign\`, {
                data: { kind: "before", contentType: "image/png" }
              });
              assert.equal(presignResponse.status(), 200, \`presign HTTP \${presignResponse.status()}\`);
              const upload = await presignResponse.json();
              assert.equal(typeof upload.uploadUrl, "string");
              assert.equal(typeof upload.objectRef, "string");

              const png = Buffer.from("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9WlW4YQAAAAASUVORK5CYII=", "base64");
              const put = await fetch(upload.uploadUrl, {
                method: "PUT",
                headers: { "content-type": "image/png" },
                body: png
              });
              assert(put.ok, \`R2 upload HTTP \${put.status}\`);

              const evidenceResponse = await provider.request.post(\`\${BASE}/api/bookings/\${bookingId}/evidence\`, {
                data: {
                  type: "before_photo",
                  objectRef: upload.objectRef,
                  note: "Automated launch QA storage verification."
                }
              });
              assert.equal(evidenceResponse.status(), 200, \`evidence HTTP \${evidenceResponse.status()}\`);
              const evidence = await evidenceResponse.json();
              assert.equal(evidence.ok, true);
              pass("Cloudflare R2 signed upload and evidence verification");
            } catch (error) {
              storageFailure = String(error?.message || error);
              console.error("R2_FAILURE", storageFailure);
            }`;

          if (!source.includes(r2Anchor)) throw new Error("r2_patch_anchor_missing");
          source = source.replace(r2Anchor, r2Patch);
          source = source.replace(
            'pass("QA service hidden after journey");',
            `pass("QA service hidden after journey");
            if (typeof storageFailure !== "undefined" && storageFailure) throw new Error("r2_validation_failed:" + storageFailure);`
          );
          fs.writeFileSync(path, source);
          NODE
      - name: Run production journey without payment
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node .production-journey-e2e.mjs
