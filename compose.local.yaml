name: verotask-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: verotask
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Run npm run local:setup first}
      POSTGRES_DB: verotask
    ports:
      - "127.0.0.1:5446:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verotask -d verotask"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8026:8025"
      - "127.0.0.1:1026:1025"
volumes:
  postgres-data:
